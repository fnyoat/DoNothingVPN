name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-cleanup: disabled

      - name: Restore signing keystore from secrets
        env:
          REPACK_KEYSTORE_B64: ${{ secrets.REPACK_KEYSTORE_B64 }}
          REPACK_STORE_PASS: ${{ secrets.REPACK_STORE_PASS }}
          REPACK_KEY_ALIAS: ${{ secrets.REPACK_KEY_ALIAS }}
          REPACK_KEY_PASS: ${{ secrets.REPACK_KEY_PASS }}
        run: |
          mkdir -p keystore
          printf '%s' "$REPACK_KEYSTORE_B64" | base64 -d > keystore/repack.p12
          printf 'repack.storePassword=%s\nrepack.keyAlias=%s\nrepack.keyPassword=%s\n' \
            "$REPACK_STORE_PASS" "$REPACK_KEY_ALIAS" "$REPACK_KEY_PASS" > keystore-local.properties

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk