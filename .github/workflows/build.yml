name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Unit tests (repack golden)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Verify repacked APK with apksigner (v1 + v2)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/repackage/repacked.apk

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/**/*.html
            app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk