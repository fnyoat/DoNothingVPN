name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-cleanup: never

      - name: Resolve signing material from CI secrets
        if: env.REPACK_KEYSTORE_BASE64 != ''
        env:
          KEYS_B64: ${{ secrets.REPACK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.REPACK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REPACK_KEY_ALIAS }}
        run: |
          echo "$KEYS_B64" | base64 -d > keystore/repack.p12
          printf 'repack.storePassword=%s\nrepack.keyAlias=%s\nrepack.keyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$STORE_PASS" > keystore-local.properties

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DoNothingVPN-release
          path: app/build/outputs/apk/release/app-release.apk