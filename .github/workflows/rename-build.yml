name: Build Renamed APK

on:
  workflow_dispatch:
    inputs:
      session_name:
        description: '新应用名（将显示在所有系统界面）'
        required: true
        default: 'MyVPN'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply app name
        env:
          SESSION_NAME: ${{ github.event.inputs.session_name }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import pathlib
          name = os.environ["SESSION_NAME"].strip()
          escaped = html.escape(name, quote=True)
          p = pathlib.Path("app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          old = '<string name="app_name">DoNothingVPN</string>'
          if old not in s:
              print("ERROR: app_name placeholder not found in strings.xml")
              raise SystemExit(1)
          s = s.replace(old, f'<string name="app_name">{escaped}</string>')
          p.write_text(s, encoding="utf-8")
          print(f"app_name set to: {name}")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Renamed-debug
          path: app/build/outputs/apk/debug/app-debug.apk